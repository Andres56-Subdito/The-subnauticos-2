<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portafolio personal de proyectos y experiencia en desarrollo web.">
  <title>Alex Rivera | Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #512b2a;
      --green: #2c875b;
      --terracotta: #954e3a;
      --stone: #726962;
      --mist: #aaaaaa;
      --paper: #f8f5f0;
      --line: rgba(81, 43, 42, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--wine);
      font-family: 'Comfortaa', sans-serif;
    }

    .site-shell {
      min-height: 100vh;
      padding: 28px clamp(22px, 6vw, 92px) 36px;
      background: radial-gradient(circle at 12% 15%, rgba(44, 135, 91, 0.10), transparent 25%), linear-gradient(135deg, #f8f5f0 0%, #f4ede4 100%);
      overflow: hidden;
      animation: page-fade-in 900ms ease-out both;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .site-shell { animation: none; }
    }

    .topbar, .content, .site-footer { max-width: 1180px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
    .monogram { color: var(--green); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.08em; }
    .content { display: grid; justify-items: center; text-align: center; padding: clamp(54px, 9vw, 112px) 0 66px; }
    .eyebrow { margin: 0 0 18px; color: var(--terracotta); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-family: 'DM Serif Display', serif; font-size: clamp(3.7rem, 9vw, 8.1rem); font-weight: 400; line-height: 0.9; letter-spacing: 0; }
    h1 em { color: var(--green); font-style: italic; }
    .portrait-wrap { position: relative; width: min(73vw, 345px); margin: 53px 0 48px; }
    .portrait-wrap::before { position: absolute; z-index: 0; top: -17px; left: -17px; width: 100%; height: 100%; border: 1px solid var(--green); content: ''; }
    .portrait { position: relative; z-index: 1; display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; filter: saturate(0.82); }
    .image-label { position: absolute; z-index: 2; right: -28px; bottom: 24px; padding: 11px 14px; background: var(--terracotta); color: white; font-size: 0.68rem; letter-spacing: 0.08em; transform: rotate(-5deg); }
    .description { max-width: 570px; margin: 0; color: var(--stone); font-size: 0.96rem; line-height: 1.8; }
    .site-footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--mist); font-size: 0.7rem; text-align: center; }

    @media (max-width: 560px) {
      .site-shell { padding-inline: 20px; }
      .image-label { right: -12px; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="monogram" href="#inicio" aria-label="Inicio">Los Subnauticas<span>.</span></a>
    </header>

    <main id="inicio" class="content">
      <p class="eyebrow">Diseño · Código · Ideas</p>
      <h1>Hola, soy<br><em>Dylan Hernández.</em></h1>
      <div class="portrait-wrap">
        <img class="portrait" src="https://i.pinimg.com/474x/9e/83/75/9e837528f01cf3f42119c5aeeed1b336.jpg?nii=t" alt="Retrato de Dylan Hernández" fetchpriority="high">
        <span class="image-label">Ing. informatico</span>
      </div>
      <section aria-labelledby="about-title">
        <p id="about-title" class="description">Desarrollador de software y diseñador de aplicaciones digitales. Me gusta hacer que problemas complejos sean productos claros, útiles y con personalidad.</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Creando nuevos proyectos · 2026</span>
    </footer>
  </div>
</body>
</html>
